<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewport Universal UI</title>

<script src="systems/manifest.js"></script>
<script src="system/use-tokens.js"></script>
<link rel="stylesheet" href="system/base.css">
<link rel="stylesheet" href="system/components.css">
<link rel="stylesheet" href="system/tiles.css">

<style>
  body { padding: var(--space-7) var(--space-5); }
  .wrap { max-width: var(--content-max); margin-inline: auto; display: flex; flex-direction: column; gap: var(--space-6); }
  .hero { display: flex; flex-direction: column; gap: var(--space-2); }
  .hero p { color: var(--text-secondary); max-width: 64ch; }
  .empty {
    padding: var(--space-6); border: 1px dashed var(--border-default);
    border-radius: var(--radius-lg); color: var(--text-muted); text-align: center;
  }
</style>
</head>

<body>
<div class="wrap">

  <header class="hero">
    <h1>Viewport Universal UI</h1>
    <p>
      Every design system and the mockups built with it. This page is read-only —
      to create, edit or delete systems and mockups, run <code>npm run studio</code>
      and open the studio.
    </p>
    <div class="u-row" style="margin-top:var(--space-2); flex-wrap: wrap">
      <a class="vp-btn vp-btn--primary" href="studio/index.html">Open studio</a>
      <a class="vp-btn vp-btn--secondary" href="system/preview.html">System preview</a>
      <a class="vp-btn vp-btn--secondary" href="docs/how-to-use.html">How to use</a>
    </div>
  </header>

  <section class="u-stack" id="systems"></section>

</div>

<script src="system/tiles.js"></script>
<script>
  const host = document.getElementById("systems");
  const systems = Array.isArray(window.VP_SYSTEMS) ? window.VP_SYSTEMS : [];

  if (systems.length === 0) {
    host.innerHTML =
      '<p class="empty">No systems yet. Run <code>npm run studio</code> and create one, ' +
      'or <code>node tools/reindex.mjs</code> if you expected to see some.</p>';
  } else {
    // Group versions under their family so iterations read as a run rather
    // than as unrelated systems.
    const families = new Map();
    for (const s of systems) {
      if (!families.has(s.family)) families.set(s.family, []);
      families.get(s.family).push(s);
    }

    host.innerHTML = [...families.entries()].map(([family, versions]) => {
      const sorted = [...versions].sort((a, b) => b.version - a.version);
      return `
        <section class="vp-tiles__group">
          <header class="vp-tiles__grouphead">
            <h2>${VPTiles.esc(sorted[0].name)}</h2>
            <span class="vp-badge">${sorted.length} version${sorted.length === 1 ? "" : "s"}</span>
          </header>
          <div class="vp-tiles">
            ${sorted.map((s) => VPTiles.systemTile(s, { base: "" })).join("")}
          </div>
        </section>`;
    }).join("");
  }
</script>
</body>
</html>
